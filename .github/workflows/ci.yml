name: Continuous Integration
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

env:
  DISABLE_SPRING: '1'

jobs:
  unit_tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      RUBY_YJIT_ENABLE: "1"
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tps_test
          POSTGRES_DB: tps_test
          POSTGRES_PASSWORD: tps_test
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup the app runtime and dependencies
        uses: ./.github/actions/ci-setup-rails

      - name: Download or pre-compile assets
        uses: ./.github/actions/ci-setup-assets

      - name: Setup split tests
        uses: ./.github/actions/ci-setup-split-tests
        with:
          results_path: tmp/*.junit.xml

      - name: Run tests
        run: |
          SPEC_FILES=$(./split_tests -glob='spec/**/*_spec.rb' -exclude-glob='spec/system/**' -split-index=1 -split-total=6 -junit -junit-path=tmp/*.junit.xml)
          echo "Running tests for bin/rspec $SPEC_FILES"
          BOOTSNAP_STATS=1 bundle exec rspec $SPEC_FILES --tag ~slow --tag ~external_deps --tag ~llm_eval --format progress --format RspecJunitFormatter --out tmp/rspec_${{ github.job }}_$1.junit.xml

      - name: Run tests 2 with warm bootsnap cache
        run: |
          SPEC_FILES=$(./split_tests -glob='spec/**/*_spec.rb' -exclude-glob='spec/system/**' -split-index=1 -split-total=6 -junit -junit-path=tmp/*.junit.xml)
          echo "Running tests for bin/rspec $SPEC_FILES"
          BOOTSNAP_STATS=1 bundle exec rspec $SPEC_FILES --tag ~slow --tag ~external_deps --tag ~llm_eval --format progress --format RspecJunitFormatter --out tmp/rspec_${{ github.job }}_$1.junit.xml
