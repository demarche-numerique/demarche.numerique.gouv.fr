        title: How does the "Current French municipality" field work?
        description_html: "This field provides values from the %{api_geo_link} (national geographic databases). It includes municipalities from metropolitan France and overseas departments (DROM). Municipalities from overseas territories (TOM) or abroad are therefore <strong>not</strong> included."
        warning_desc_html: "If you set this field as mandatory and the user needs to enter a municipality outside metropolitan France / DROM or abroad, they <strong>will be blocked</strong> from submitting their dossier.<br><br>If in doubt, we recommend leaving this field optional, adding a preliminary question to apply conditional logic to the field, or using a Short text field instead."
