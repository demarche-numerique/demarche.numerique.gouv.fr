fr:
  administration_mailer:
    refuse_admin:
      title: Demande de création de compte refusée
      intended_for: Les comptes administrateurs sont destinés aux administrations publiques souhaitant mettre en place sur leurs sites internet des démarches dématérialisées pour leurs usagers. Il ne semble pas que ce soit votre cas.
      access: Pour les usagers ou les administrations publiques (collectivités, etc.) qui souhaitent remplir une démarche ou déposer un dossier en ligne, l’entrée dans %{application_name} se fait via un lien fourni par l’administration responsable, sur son propre site web. Ce lien vous permettra de créer un compte et de remplir le formulaire dans la foulée.
      contact_html: Si par contre vous rencontrez des problèmes lors de l’utilisation de %{application_name} en tant qu’usager, merci d’expliciter le problème rencontré sur notre %{link} .
      contact_link: formulaire de contact
      contact_admin_html: Si vous avez fait une demande de compte administrateur légitime avec une adresse électronique grand public (Orange, Wanadoo, etc.), merci de nous contacter sur notre %{link} .
      contact_admin_link: formulaire de contact administrateur
