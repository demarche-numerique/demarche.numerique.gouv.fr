fr:
  pro_connect_migrations:
    show:
      title: Migration vers ProConnect
      notice_title: Information importante
      notice_desc: À partir du 1er janvier 2027, la connexion à votre espace administrateur par adresse électronique et mot de passe ne sera plus possible. Seule la connexion avec ProConnect sera autorisée.
      what_next: "En cliquant sur le bouton « Migrer vers ProConnect » ci-dessous, vous pourrez :"
      sign_in_html: "<strong>Vous connecter</strong> si vous avez déjà un compte ProConnect"
      sign_up_html: "<strong>Vous inscrire</strong> si vous n’avez pas encore de compte ProConnect"
      nominative_html: ProConnect exige une identité <strong>nominative</strong> rattachée à une adresse électronique professionnelle et à un numéro SIRET actif (les adresses personnelles, anonymes ou purement génériques sans rattachement nominatif ne sont généralement pas acceptées).
      who_can_sign_up: Qui peut se créer un compte ProConnect ?
      migrate: Migrer vers ProConnect
    support:
      title: Migrer vers ProConnect
      alert_title: Migration impossible
      security: Pour des raisons de sécurité, il n’est pas possible d’effectuer cette migration de façon autonome.
      contact_html: Veuillez nous contacter à %{contact_link} <strong>en précisant bien la demande ci-dessous</strong>.
      request_intro: "Voici la demande à copier-coller dans votre message :"
      request: Je ne peux pas effectuer de façon autonome la migration de mon compte %{application_name} "%{source_email}" vers mon compte ProConnect "%{pro_connect_email}".
      copied: La demande est copiée
      home: Accueil %{application_name}
    completed:
      title: Migrer vers ProConnect
      alert_title: Migration terminée !
      signed_in_html: Vous êtes bien connecté(e) à votre espace administrateur <strong>%{email}</strong> via ProConnect.
      pro_connect_only_html: Désormais, vous devrez vous connecter à votre espace administrateur uniquement <strong>via ProConnect</strong>.
      procedures: Voir mes démarches
