fr:
  pro_connect_migrations:
    show:
      title: Migration vers ProConnect
      notice_title: Information importante
      notice_desc: À partir du 1er janvier 2027, la connexion à votre espace administrateur par adresse électronique et mot de passe ne sera plus possible. Seule la connexion avec ProConnect sera autorisée.
      what_next: "En cliquant sur le bouton « Migrer vers ProConnect » ci-dessous, vous pourrez :"
      sign_in_html: "<strong>Vous connecter</strong> si vous avez déjà un compte ProConnect"
      sign_up_html: "<strong>Vous inscrire</strong> si vous n’avez pas encore de compte ProConnect"
      nominative_html: ProConnect exige une identité <strong>nominative</strong> rattachée à une adresse électronique professionnelle et à un numéro SIRET actif (les adresses personnelles, anonymes ou purement génériques sans rattachement nominatif ne sont généralement pas acceptées).
      who_can_sign_up: Qui peut se créer un compte ProConnect ?
      migrate: Migrer vers ProConnect
    support:
      title: Migrer vers ProConnect
      alert_title: Migration impossible
      security: Pour des raisons de sécurité, il n’est pas possible d’effectuer cette migration de façon autonome.
      contact_html: Veuillez nous contacter à %{contact_link} <strong>en précisant bien la demande ci-dessous</strong>.
      request_intro: "Voici la demande à copier-coller dans votre message :"
      request: Je ne peux pas effectuer de façon autonome la migration de mon compte %{application_name} "%{source_email}" vers mon compte ProConnect "%{pro_connect_email}".
      copied: La demande est copiée
      home: Accueil %{application_name}
    completed:
      title: Migrer vers ProConnect
      alert_title: Migration terminée !
      signed_in_html: Vous êtes bien connecté(e) à votre espace administrateur <strong>%{email}</strong> via ProConnect.
      pro_connect_only_html: Désormais, vous devrez vous connecter à votre espace administrateur uniquement <strong>via ProConnect</strong>.
      pro_connect_only_with_address_html: Désormais, vous devrez vous connecter à votre espace administrateur uniquement <strong>via ProConnect</strong> avec votre adresse <strong>%{email}</strong> (et non plus avec l’adresse %{source_email}).
      notifications_html: Les notifications par email seront dorénavant envoyées à <strong>%{email}</strong> (et non plus à l’adresse %{source_email}).
      dossiers_html: Les dossiers déposés en tant qu’usager sur ce compte seront maintenant uniquement accessibles sur ce compte <strong>%{email}</strong>.
      closed_html: L’accès à ce compte avec l’adresse %{source_email} sera <strong>désactivé</strong>.
      only_holder_html: Vous êtes maintenant la seule personne à avoir accès à ce compte via ProConnect avec l’adresse <strong>%{email}</strong>.
      others_must_migrate: Les autres personnes qui avaient accès à ce compte en tant qu’administrateur devront également migrer vers ProConnect.
      procedures: Voir mes démarches
    code:
      title: Migrer vers ProConnect
      subtitle: Vérification de votre identité
      explanation_html: "Pour finaliser votre migration vers ProConnect, veuillez renseigner le code de sécurité envoyé par email à l’adresse <strong>%{source_email}</strong>&nbsp;:"
      label: Code de sécurité
      hint: "Format attendu : 6 chiffres"
      submit: Valider le code de sécurité
      not_received: "Vous n’avez pas reçu le code ? Pensez à vérifier votre dossier de spam ou d’indésirables."
      resend: Renvoyer un nouveau code
      timed_out: Le délai pour finaliser la migration vers ProConnect est dépassé. Reconnectez-vous pour la reprendre.
    verify_code:
      wrong_code: Ce code de sécurité est incorrect.
      expired_code: Ce code de sécurité a expiré. Demandez-en un nouveau avec « Renvoyer un nouveau code ».
      attempts_spent: Le code de sécurité a été trop souvent mal saisi. Reconnectez-vous pour reprendre la migration.
    sharing:
      title: Migrer vers ProConnect
      subtitle: Compte partagé ?
      question: Est-ce que les identifiants du compte %{application_name} "%{source_email}" étaient partagés avec d’autres personnes ?
      hint: Répondez « Oui » si vous étiez plusieurs administrateurs à vous connecter sur ce même compte.
      "yes": Oui
      "no": Non
      consequences: "À l’issue de la migration vers ProConnect :"
      shared_only_holder_html: Vous serez la seule personne à avoir accès à ce compte via ProConnect avec l’adresse <strong>%{pro_connect_email}</strong>
      shared_notifications_html: Les notifications par email seront dorénavant envoyées à <strong>%{pro_connect_email}</strong> (et non plus à l’adresse %{source_email})
      shared_others_html: Les autres personnes qui avaient accès à ce compte en tant qu’administrateur <strong>devront également effectuer leur migration vers ProConnect</strong>
      not_shared_pro_connect_only_html: Vous devrez vous connecter à votre espace administrateur uniquement via ProConnect avec votre adresse <strong>%{pro_connect_email}</strong>
      not_shared_closed_html: L’accès à ce compte avec l’adresse <strong>%{source_email}</strong> sera désactivé
      submit: Terminer ma migration vers ProConnect
    resend_code:
      sent: Un nouveau code de sécurité a été envoyé à %{source_email}.
      too_soon: Un code vient d’être envoyé. Patientez une minute avant d’en demander un nouveau.
    conflict: Ce compte a changé entre-temps. Reconnectez-vous pour reprendre la migration.
