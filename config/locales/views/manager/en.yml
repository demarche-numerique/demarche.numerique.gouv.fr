      self_deletion_forbidden: "You cannot delete your own super admin account from this screen."
      show:
        cannot_be_deleted: "You cannot delete your own super admin account."
      reset_otp_edit:
        title: "Reset two-factor authentication"
        warning_html: "You are about to reset the two-factor authentication of <strong>%{email}</strong>. They will have to sign in again with their password and then enroll their authenticator app anew."
        submit: "Reset OTP"
      reset_otp:
        success: "Two-factor authentication for %{email} has been reset."
      delete_edit:
        title: "Delete super admin account %{id}"
        warning_html: "You are about to delete the super admin account of <strong>%{email}</strong>."
        access: "They lose access to the Manager immediately, open sessions included. No other super admin is notified."
        irreversible: "The account cannot be created again from the Manager: it takes a command on a server."
        account: "Only the Manager access is deleted: platform accounts with the same address, administrateur or instructeur, are left untouched and have to be handled separately."
        submit: "Delete the super admin"
      delete:
        success: "The super admin account of %{email} has been deleted."
    gestionnaires:
      manage_root_groupe_gestionnaire: Root group management
      show:
        cannot_be_deleted: "This gestionnaire cannot be deleted: they are the only gestionnaire of a root group."
      delete_edit:
        title: "Delete gestionnaire %{id}"
        warning_html: "You are about to delete the gestionnaire role of <strong>%{email}</strong>. They are removed from the administrateur groups they manage."
        account: "Their sign-in account is not deleted: only the gestionnaire role is."
        submit: "Delete the gestionnaire"
    instructeurs:
      show:
        cannot_be_deleted: "This instructeur cannot be deleted: they are an administrateur, or one of their procedures has a single instructeur in its default group."
      delete_edit:
        title: "Delete instructeur %{id}"
        warning_html: "You are about to delete the instructeur role of <strong>%{email}</strong>. Their assignments to instructeur groups, their dossier follows, their bulk messages, their exports and their archives are destroyed."
        account: "Their sign-in account is not deleted: only the instructeur role is. The messages they wrote in the mailboxes stay visible."
        submit: "Delete the instructeur"
    administrateurs:
      show:
        cannot_be_deleted: "This administrateur cannot be deleted: they are the only administrateur of a procedure that has dossiers."
      delete_edit:
        title: "Delete administrateur %{id}"
        warning_html: "You are about to delete the administrateur role of <strong>%{email}</strong>."
