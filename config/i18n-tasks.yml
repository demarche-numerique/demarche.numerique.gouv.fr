# i18n-tasks finds and manages missing and unused translations: https://github.com/glebm/i18n-tasks

<% require './lib/linters/i18n_tasks_view_components' %>

# The "main" locale.
base_locale: fr
locales: [fr, en]
## Reporting locale, default: en. Available: en, ru.
# internal_locale: en

# Read and write translations.
data:
  # Custom adapter nesting ViewComponent sidecar files under their component scope:
  adapter: I18nTasksViewComponents::Data

  # Locale files or `File.find` patterns where translations are read from:
  read:
    - config/locales/*%{locale}.yml
    - config/locales/**/*%{locale}.yml
    - config/custom_locales/*%{locale}.yml
    # ViewComponent sidecar translations (bar_component.fr.yml and bare fr.yml styles):
    - app/components/**/*%{locale}.yml

  # Locale files to write new keys to, based on a list of key pattern => file rules. Matched from top to bottom:
  # `i18n-tasks normalize -p` will force move the keys according to these rules
  write:
    ## For example, write devise and simple form keys to their respective files:
    # - ['{devise, simple_form}.*', 'config/locales/\1.%{locale}.yml']
    ## Catch-all default:
    # - config/locales/%{locale}.yml

  # External locale data (e.g. gems).
  # This data is not considered unused and is never written to.
  # Resolved via Gem::Specification (not `bundle info`, which fails outside a Bundler context):
  external:
    - '<%= Gem::Specification.find_by_name("administrate").gem_dir %>/config/locales/*%{locale}.yml'
    - '<%= Gem::Specification.find_by_name("devise-i18n").gem_dir %>/rails/locales/*%{locale}.yml'

  ## Specify the router (see Readme for details). Valid values: conservative_router, pattern_router, or a custom class.
  # router: conservative_router

  yaml:
    write:
      # do not wrap lines at 80 characters
      line_width: -1

  ## Pretty-print JSON:
  # json:
  #   write:
  #     indent: '  '
  #     space: ' '
  #     object_nl: "\n"
  #     array_nl: "\n"

# Find translate calls
search:
  ## Paths or `File.find` patterns to search in:
  # paths:
  #  - app/

  ## Root directories for relative keys resolution.
  relative_roots:
    - app/components
    - app/controllers
    - app/helpers
    - app/mailers
    - app/presenters
    - app/views

  ## Files or `File.fnmatch` patterns to exclude from search. Some files are always excluded regardless of this setting:
  ##   %w(*.jpg *.png *.gif *.svg *.ico *.eot *.otf *.ttf *.woff *.woff2 *.pdf *.css *.sass *.scss *.less *.yml *.json)
  exclude:
    - app/assets/images
    - app/assets/fonts
    - app/assets/videos

  ## Alternatively, the only files or `File.fnmatch patterns` to search in `paths`:
  ## If specified, this settings takes priority over `exclude`, but `exclude` still applies.
  # only: ["*.rb", "*.html.slim"]

  ## If `strict` is `false`, guess usages such as t("categories.#{category}.title"). The default is `true`.
  # strict: true

  ## Multiple scanners can be used. Their results are merged.
  ## The options specified above are passed down to each scanner. Per-scanner options can be specified as well.
  ## See this example of a custom scanner: https://github.com/glebm/i18n-tasks/wiki/A-custom-scanner-example

## Translation Services
# translation:
#   # Google Translate
#   # Get an API key and set billing info at https://code.google.com/apis/console to use Google Translate
#   google_translate_api_key: "AbC-dEf5"
#   # DeepL Pro Translate
#   # Get an API key and subscription at https://www.deepl.com/pro to use DeepL Pro
#   deepl_api_key: "48E92789-57A3-466A-9959-1A1A1A1A1A1A"

## Consider these keys defined (missing check):
ignore_missing:
  # Abstract base component: t('.add_condition') etc. resolve at runtime against
  # each subclass's sidecar (champs_conditions, ineligibilite_rules, routing_rules).
  - 'conditions.conditions_component.*'

## Consider these keys used:
ignore_unused:
  # t(".#{batch.operation}.finish.text_success") in batch_alert_component.html.haml
  - 'dossiers.batch_alert_component.*'
  # t(category, scope: ".categories") in tags_button_list_component.html.erb
  - 'tags_button_list_component.categories.*'
  # dynamic key composition (".blank" / ".blank_optional" + "_attachment") in champs_rows_show_component.rb
  - 'dossiers.champs_rows_show_component.{blank,blank_optional,blank_attachment,blank_optional_attachment}'
  # t(updated? ? '.updated_at' : '.created_at') in gallery_item_component.html.erb
  - 'attachment.gallery_item_component.{created_at,updated_at}'
  # t(@procedure.publiee? ? '.notification_alert.publiee' : '.notification_alert.non_publiee')
  - 'procedure.instructeurs_management_component.notification_alert.*'
  # t(@champ.fc_data_not_found? ? '.piece_justificative_champ.data_not_found' : '...data_not_recovered')
  - 'editable_champ.france_connect_champ_base_component.piece_justificative_champ.*'
  - 'errors.format'
  - 'user_mailer.*.subject'
